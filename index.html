<!doctype html>
<html lang="en">

<head>
    <title>Happy Birthday, Devanshi! 🎂</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A special birthday celebration for Devanshi.">
    <meta name="theme-color" content="#ffd6e7">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="loader">
                <button id="play" type="button" aria-label="Start Devanshi's birthday surprise">Open your surprise 🎁</button>
            </div>
        </div>
    </div>
    <audio class="song" controls loop>
        <source src="music.mp3">
        </source>
        Your browser isn't invited for super fun audio time.
    </audio>
    <canvas id="confetti"></canvas>
    <div class="main">
        <div class="container pt-5">
            <div class="row">

                <div class="col-12 col-xl-6 mx-auto">
                    <img src="img/banner.png" alt="Happy Birthday banner">
                </div>

                <div class="col-12  text-center">
                    <div id="name" class="area">Devanshi</div>
                </div>

                <div class="col-12 text-center">
                    <div class="type-wrap">
                        <div id="typed-strings" class="typing">
                            <h2>Happy Birthday <i id="nae">Devanshi</i>! 🎉</h2>
                            <h2>Today is all about celebrating you ✨</h2>
                            <h2>May your day be filled with love, laughter, and happiness 💖</h2>
                            <h2>Wishing you the most wonderful year ahead! 🎂</h2>
                        </div>
                        <span id="typed" style="white-space:pre;"></span>
                    </div>
                </div>

                <div class="col-12 col-xl-3 cake">
                    <img src="img/cake.gif" alt="Animated birthday cake">
                </div>
            </div>
        </div>
        <img src="img/Balloon-Border.png" width="100%" class="balloon-border">
    </div>
</body>
<script src="https://unpkg.com/magic-snowflakes/dist/snowflakes.min.js"></script>
<script src="js/jquery.js"></script>
<script src="js/typed.min.js"></script>
<script src="js/script.js"></script>

</html>
